services:
  - type: web
    name: openjarvis
    runtime: docker
    plan: starter
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: openjarvis-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8000
      - key: OPENJARVIS_HOME
        value: /var/data/openjarvis
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OPENJARVIS_API_KEY
        sync: false
