OpenJarvis configuration — Gemini API evaluation
===============================================================
PILLAR 1: Intelligence — Gemini model
===============================================================

[intelligence] default_model = "gemini-2.5-flash" fallback_model = "gemini-2.5-flash" preferred_engine = "cloud" provider = "google" quantization = "none"

Evaluation defaults

temperature = 0.0 max_tokens = 2048 top_p = 0.9 top_k = 40 repetition_penalty = 1.0

===============================================================
PILLAR 2: Agent — Agentic harness
===============================================================

[agent] default_agent = "native_openhands" max_turns = 10 tools = "code_interpreter,web_search,file_read,calculator,think" objective = "Answer questions accurately using available tools" context_from_memory = false

===============================================================
PILLAR 3: Tools — MCP and storage
===============================================================

[tools.storage] default_backend = "sqlite" db_path = "~/.openjarvis/memory.db"

[tools.mcp] enabled = true

===============================================================
PILLAR 4: Engine — Cloud inference through Gemini
===============================================================

[engine] default = "cloud"

Local engines retained for optional future use

[engine.vllm] host = "http://localhost:8001"

[engine.ollama] host = "http://localhost:11434"

[engine.sglang] host = "http://localhost:30000"

[engine.llamacpp] host = "http://localhost:8080"

[engine.exo] host = "http://localhost:52415"

[engine.nexa] host = "http://localhost:18181"

[engine.uzu] host = "http://localhost:8080"

[engine.apple_fm] host = "http://localhost:8079"

===============================================================
PILLAR 5: Learning — Evaluation settings
===============================================================

[learning] enabled = false

[learning.routing] policy = "heuristic"

[learning.intelligence] policy = "none"

[learning.agent] policy = "none"

[learning.metrics] accuracy_weight = 0.6 latency_weight = 0.2 cost_weight = 0.1 efficiency_weight = 0.1

===============================================================
Supporting configuration
===============================================================

[telemetry] enabled = true db_path = "~/.openjarvis/telemetry.db" gpu_metrics = true gpu_poll_interval_ms = 50 energy_vendor = "" warmup_samples = 0 steady_state_window = 5 steady_state_threshold = 0.05

[traces] enabled = true db_path = "~/.openjarvis/traces.db"

[server] host = "127.0.0.1" port = 8000 agent = "native_openhands"